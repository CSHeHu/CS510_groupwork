# For configuration examples were used: 
# https://nginx.org/en/docs/beginners_guide.html
# https://nginx.org/en/docs/http/websocket.html

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  3600;

  upstream realtime_ws {
    server realtime:4000;
  }

  upstream analytics_api {
    server analytics:3000;
  }

  server {
    listen 80 default_server;
    server_name _;

    # Serve static files
    root /usr/share/nginx/html;
    index index.html;

    # WebSocket proxy
    location /ws/ {
      proxy_pass http://realtime_ws/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Help got from https://stackoverflow.com/questions/29579208/why-does-my-websocket-close-after-a-few-minutes
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # REST API proxy
    location /api/ {
      proxy_pass http://analytics_api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

  }
}
